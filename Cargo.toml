[package]
name = "solana-epoch-roll-rs"
version = "0.1.0"
edition = "2021"
authors = ["ProviRoll <dev@proviroll.xyz>"]
description = "Solana validator compliance and epoch monitor"

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP & Serialization
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration & Env
dotenvy = "0.15"
config = "0.14"

# Time & Logic
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
regex = "1.10"
fxhash = "0.2"

# Logging & Instrumentation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
async-trait = "0.1"
futures = "0.3"